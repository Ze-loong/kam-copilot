<svg viewBox="0 0 900 830" xmlns="http://www.w3.org/2000/svg" role="img">
<title>画像生成主流程数据流图</title>
<desc>顾问在企微侧边栏发起生成画像指令，经kam_sidebar转发给kam_agent只拿到thread_id，等SSE连接真正建立后才加载数据并调用LLM生成草稿写入Store并通过SSE推送，顾问逐字段确认后对该字段独立子图resume回写Store，全流程9个步骤</desc>

<style>
  .step { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
  .stepHot { fill: #eef2ff; stroke: #6366f1; stroke-width: 2; rx: 10; }
  .stepWait { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.5; stroke-dasharray: 5 3; rx: 10; }
  .num { fill: #6366f1; }
  .numText { font: 700 13px "Segoe UI", sans-serif; fill: #ffffff; }
  .title { font: 600 14px "Segoe UI", sans-serif; fill: #0f172a; }
  .sub { font: 400 12px "Segoe UI", sans-serif; fill: #64748b; }
  .waitLabel { font: 600 12px "Segoe UI", sans-serif; fill: #ea580c; }
  .arrow { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
</style>

<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
  </marker>
</defs>

<!-- Step 1 -->
<circle cx="45" cy="45" r="16" class="num"/>
<text x="45" y="50" text-anchor="middle" class="numText">1</text>
<rect x="80" y="20" width="740" height="50" class="step"/>
<text x="100" y="40" class="title">顾问在企微侧边栏发起"生成画像"指令</text>
<text x="100" y="58" class="sub">用户操作，触发链路起点</text>

<line x1="450" y1="70" x2="450" y2="98" class="arrow" marker-end="url(#a)"/>

<!-- Step 2 -->
<circle cx="45" cy="125" r="16" class="num"/>
<text x="45" y="130" text-anchor="middle" class="numText">2</text>
<rect x="80" y="100" width="740" height="50" class="step"/>
<text x="100" y="120" class="title">kam_sidebar 调用 POST /tasks/generate_profile</text>
<text x="100" y="138" class="sub">kam_agent 只生成并返回主任务 thread_id，不执行图</text>

<line x1="450" y1="150" x2="450" y2="178" class="arrow" marker-end="url(#a)"/>

<!-- Wait: SSE建立 -->
<rect x="80" y="180" width="740" height="46" class="stepWait"/>
<text x="100" y="200" class="waitLabel">⏸ 等待 SSE 连接建立（GET /tasks/stream/{thread_id}）</text>
<text x="100" y="217" class="sub">刻意推迟执行到这一步，避免"HTTP已跑完图、SSE还没连上、事件被漏掉"的竞态</text>

<line x1="450" y1="226" x2="450" y2="254" class="arrow" marker-end="url(#a)"/>

<!-- Step 3 -->
<circle cx="45" cy="281" r="16" class="num"/>
<text x="45" y="286" text-anchor="middle" class="numText">3</text>
<rect x="80" y="256" width="740" height="56" class="stepHot"/>
<text x="100" y="278" class="title">SSE 连接建立后，kam_agent 加载该客户的聊天记录 / 订单 / 客服记录（从Store读）</text>
<text x="100" y="296" class="sub">load_data 节点：公用前置步骤，避免子任务重复查询</text>

<line x1="450" y1="312" x2="450" y2="340" class="arrow" marker-end="url(#a)"/>

<!-- Step 4 -->
<circle cx="45" cy="367" r="16" class="num"/>
<text x="45" y="372" text-anchor="middle" class="numText">4</text>
<rect x="80" y="342" width="740" height="56" class="stepHot"/>
<text x="100" y="364" class="title">调用 LLM 生成画像草稿（含置信度 + 来源），再对每个字段各自开独立子图</text>
<text x="100" y="382" class="sub">generate_all_field_drafts 生成全部草稿 → 每字段独立子thread_id分别invoke画像子图</text>

<line x1="450" y1="398" x2="450" y2="426" class="arrow" marker-end="url(#a)"/>

<!-- Step 5 -->
<circle cx="45" cy="453" r="16" class="num"/>
<text x="45" y="458" text-anchor="middle" class="numText">5</text>
<rect x="80" y="428" width="740" height="56" class="step"/>
<text x="100" y="450" class="title">草稿直接写入 Store（PostgreSQL），字段状态标记 draft / need_verify</text>
<text x="100" y="468" class="sub">confidence ≤ 3 自动标 need_verify；不写Redis，容器重启不丢草稿</text>

<line x1="450" y1="484" x2="450" y2="512" class="arrow" marker-end="url(#a)"/>

<!-- Step 6 -->
<circle cx="45" cy="539" r="16" class="num"/>
<text x="45" y="544" text-anchor="middle" class="numText">6</text>
<rect x="80" y="514" width="740" height="56" class="stepHot"/>
<text x="100" y="536" class="title">kam_agent 通过 SSE 将草稿实时推送给 kam_sidebar</text>
<text x="100" y="554" class="sub">每字段独立子thread_id，逐字段流式吐出，全部推完发 done 事件</text>

<line x1="450" y1="570" x2="450" y2="598" class="arrow" marker-end="url(#a)"/>

<!-- Step 7 -->
<circle cx="45" cy="625" r="16" class="num"/>
<text x="45" y="630" text-anchor="middle" class="numText">7</text>
<rect x="80" y="600" width="740" height="50" class="step"/>
<text x="100" y="620" class="title">顾问在侧边栏逐字段确认（ok / discard / recreate）</text>
<text x="100" y="638" class="sub">低置信度字段不可批量跳过，必须单独查看</text>

<line x1="450" y1="650" x2="450" y2="678" class="arrow" marker-end="url(#a)"/>

<!-- Step 8 -->
<circle cx="45" cy="705" r="16" class="num"/>
<text x="45" y="710" text-anchor="middle" class="numText">8</text>
<rect x="80" y="680" width="740" height="50" class="step"/>
<text x="100" y="700" class="title">kam_sidebar 将确认结果传回 kam_agent（/tasks/confirm）</text>
<text x="100" y="718" class="sub">Command(resume=...) 精确恢复该字段独立的画像子图执行实例（非主图）</text>

<line x1="450" y1="730" x2="450" y2="758" class="arrow" marker-end="url(#a)"/>

<!-- Step 9 -->
<circle cx="45" cy="785" r="16" class="num"/>
<text x="45" y="790" text-anchor="middle" class="numText">9</text>
<rect x="80" y="760" width="740" height="56" class="step"/>
<text x="100" y="782" class="title">更新 Store 中对应字段状态为 confirmed（终态，不再被新草稿覆盖）</text>
<text x="100" y="800" class="sub">kam_admin 读取的数据与 kam_sidebar 看到的是同一份，无需同步</text>

</svg>
