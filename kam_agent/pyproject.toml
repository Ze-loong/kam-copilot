[project]
name = "kam-agent"
version = "0.1.0"
description = "KAM Copilot的 LangGraph 核心引擎"
requires-python = ">=3.11"
dependencies = [
    "langchain-deepseek>=1.1.0",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.4",
    "python-dotenv>=1.2.2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sentence-transformers>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
